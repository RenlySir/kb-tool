services:
  kb-tool:
    build:
      context: .
      target: runtime
    depends_on:
      - tidb
    environment:
      TIDB_HOST: tidb
      TIDB_PORT: "4000"
      TIDB_USER: root
      TIDB_PASSWORD: ""
      TIDB_DATABASE: kb
      KB_TOOL_API_TOKEN: ${KB_TOOL_API_TOKEN:-dev-token}
      KB_TOOL_ADMIN_USER: ${KB_TOOL_ADMIN_USER:-admin}
      KB_TOOL_ADMIN_PASSWORD: ${KB_TOOL_ADMIN_PASSWORD:-admin123}
      KB_TOOL_MAX_FILE_BYTES: ${KB_TOOL_MAX_FILE_BYTES:-512MiB}
      KB_TOOL_MAX_TEXT_BYTES: ${KB_TOOL_MAX_TEXT_BYTES:-2MiB}
    command:
      - server
      - -addr
      - 0.0.0.0:8080
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    ports:
      - "8080:8080"

  tidb:
    image: pingcap/tidb:v8.5.0
    command:
      - --store=unistore
      - --path=/tmp/tidb
    ports:
      - "4000:4000"
      - "10080:10080"
